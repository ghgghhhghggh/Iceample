[package]
name = "iceample"
version = "2.1.0"
description = "Iceample — Sampler, séquenceur, piste audio, DAW modulaire"
authors = ["Soaho"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "iceample_v2_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
midir = "0.10"
libloading = "0.8"
crossbeam-channel = "0.5"
lopdf = "0.34"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
photon-rs = { version = "0.3", default-features = false }
imageproc = "0.25"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["winuser", "windef", "libloaderapi", "minwindef", "objbase"] }

